<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Orbit UI — Setup Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ambient.css">
<link rel="stylesheet" href="orbit.css?v=1.20">
<link rel="stylesheet" href="gc.css?v=1.20">
</head>
<body class="ambient amb-surface">

<header class="topbar">
  <div class="brand">
    <span class="amb-led" id="powerLed"></span>
    <h1>ORBIT<span>·UI</span></h1>
    <span class="version" id="appVersion"></span>
  </div>
  <div class="programbar">
    <label class="field" title="Receive Channel — the channel Orbit listens on for program changes and bank selects. Separate from the transmit channel set on each zone.">
      <span>RECEIVE&nbsp;CH</span>
      <select id="globalCh"></select>
    </label>
    <label class="field">
      <span>PGM</span>
      <input id="progNum" type="text" value="&mdash;" readonly tabindex="-1" title="program change number — the loaded Setup's position in the Set List">
    </label>
    <label class="field">
      <span>SETUP</span>
      <input id="progName" type="text" maxlength="10" value="INIT" autocapitalize="characters" spellcheck="false">
    </label>
  </div>
</header>

<nav class="out-tabs" aria-label="output">
  <button class="out-tab ot-midi on" data-tab="midi" type="button" title="zones that send MIDI"><span class="ot-dot"></span>MIDI</button>
  <button class="out-tab ot-analog" data-tab="analog" type="button" title="zones that drive the two EXP jacks"><span class="ot-dot"></span>ANALOG OUT</button>
  <button class="out-tab ot-gc" data-tab="gc" type="button" hidden title="the Ground Control unit: its Setups, effects and screens"><span class="ot-dot"></span>GROUND CONTROL</button>
</nav>

<main id="axes"></main>
<div id="gcTop" hidden></div>

<div class="lib-outer">
  <section class="librarian ambient amb-surface amb-chamfer amb-elevation-2 ambx-panel amb-mat-blasted amb-rounded-xl">
    <div class="lib-col">
      <div class="lib-head">
        <h2 id="libTitle">LIBRARY OF SETUPS</h2>
      </div>
      <div class="sl-tools">
        <button class="ghostbtn" id="saveNewBtn" type="button" title="save the current settings as a new Setup">+ new</button>
      </div>
      <ul class="lib-list" id="libList"></ul>
    </div>
    <div class="lib-col">
      <div class="lib-head">
        <h2>SET LIST</h2>
      </div>
      <div class="sl-tools">
        <select id="slSelect" title="which Set List you are editing"></select>
        <button class="ghostbtn" id="slNew" type="button" title="create a new Set List">+ new</button>
        <button class="ghostbtn" id="slEdit" type="button" title="rename, re-bank or delete this Set List">edit</button>
      </div>
      <ul class="lib-list" id="setList"></ul>
      <div class="midi-in">
        <span class="mi-title">MIDI IN · TEST</span>
        <label class="field"><span>CH</span><select id="miCh"></select></label>
        <label class="field" title="optional Bank Select sent before the PC (blank = none)"><span>BANK</span><input id="miBank" type="number" min="0" max="127" placeholder="—" inputmode="numeric"></label>
        <label class="field"><span>PC</span><input id="miPc" type="number" min="1" max="128" value="1" inputmode="numeric"></label>
        <button class="ghostbtn" id="miSend" type="button">send</button>
        <span id="miLog"></span>
      </div>
    </div>
  </section>
</div>

<div id="gcTab" hidden></div>

<footer class="hints">
  <label class="polarity simswitch" title="show a GROUND CONTROL tab wired to a Ground Control simulated in this page">
    <span class="pol-lbl">simulate Ground Control</span>
    <input type="checkbox" id="gcSimToggle">
    <span class="pol-switch"></span>
  </label>
  <span class="foot-tools">
    <button class="ghostbtn" id="exportBtn" type="button" title="save both libraries, every Set List, the receive channel — and, with a Ground Control connected, a full backup of its Setups — to a .json file">export file</button>
    <button class="ghostbtn" id="importBtn" type="button" title="restore libraries and Set Lists from a .json file made by export; its Ground Control Setups are written to the connected unit">import file</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
    <button class="ghostbtn" id="resetBtn" type="button">reset demo</button>
  </span>
</footer>

<div id="popover" class="ambient amb-surface amb-chamfer amb-elevation-3 amb-mat-blasted amb-rounded-lg" hidden></div>

<div id="slWrap" hidden>
  <div id="slScrim"></div>
  <div id="slDialog" class="ambient amb-surface amb-chamfer amb-elevation-3 amb-mat-blasted amb-rounded-xl">
    <div class="modal-head"><h2 id="slTitle">NEW SET LIST</h2></div>
    <div class="pop-rows">
      <div class="pop-row"><label>Name</label><input id="slName" type="text" maxlength="10" autocapitalize="characters" spellcheck="false"></div>
      <div class="pop-row"><label>Bank</label><input id="slBank" type="number" min="0" max="127" inputmode="numeric"></div>
      <div class="pop-note">the MIDI Bank Select number (CC 0 on the receive channel) that recalls this Set List</div>
    </div>
    <div class="modal-foot">
      <button class="dangerbtn slim" id="slDel" type="button" hidden>delete</button>
      <button class="amb-button ambx-press-sm" id="slCancel" type="button">
        <span class="amb-button-cap ambient amb-chamfer amb-surface amb-heading-3">Cancel</span>
      </button>
      <button class="amb-button ambx-press-sm" id="slOk" type="button">
        <span class="amb-button-cap ambient amb-chamfer amb-surface amb-heading-3">Create</span>
      </button>
    </div>
  </div>
</div>

<div id="askWrap" hidden>
  <div id="askScrim"></div>
  <div id="ask" class="ambient amb-surface amb-chamfer amb-elevation-3 amb-mat-blasted amb-rounded-xl">
    <div class="modal-head"><h2 id="askTitle">UNSAVED CHANGES</h2></div>
    <p id="askText"></p>
    <div class="modal-foot">
      <button class="amb-button ambx-press-sm" id="askCancel" type="button">
        <span class="amb-button-cap ambient amb-chamfer amb-surface amb-heading-3">Cancel</span>
      </button>
      <button class="amb-button ambx-press-sm" id="askDiscard" type="button">
        <span class="amb-button-cap ambient amb-chamfer amb-surface amb-heading-3">Discard</span>
      </button>
      <button class="amb-button ambx-press-sm" id="askSave" type="button">
        <span class="amb-button-cap ambient amb-chamfer amb-surface amb-heading-3">Save</span>
      </button>
    </div>
  </div>
</div>

<script src="gc/protocol.js?v=1.20"></script>
<script src="gc/effects.js?v=1.20"></script>
<script src="gc/curve.js?v=1.20"></script>
<script src="gc/factory.js?v=1.20"></script>
<script src="gc/sim.js?v=1.20"></script>
<script src="link.js?v=1.20"></script>
<script src="gc/tab.js?v=1.20"></script>
<script src="orbit.js?v=1.20"></script>
</body>
</html>
